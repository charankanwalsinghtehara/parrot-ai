services:
  - type: web
    name: parrotcare-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: parrotcare-db
          property: connectionString
      - key: DJANGO_ALLOWED_HOSTS
        fromService:
          name: parrotcare-api
          type: web
          property: host
      - key: CORS_ALLOWED_ORIGINS
        fromService:
          name: parrotcare-web
          type: web
          property: host
      - key: CSRF_TRUSTED_ORIGINS
        fromService:
          name: parrotcare-web
          type: web
          property: host
      - key: AI_PROVIDER
        value: none
  - type: web
    name: parrotcare-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: parrotcare-api
          type: web
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
databases:
  - name: parrotcare-db
    databaseName: parrotcare
    user: parrotcare
    plan: basic-256mb